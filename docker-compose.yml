version: '3.8'

services:
  # ─── MySQL 8 Database ──────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: citizenlex-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-CitizenLexDB}
      MYSQL_USER: ${DB_USER:-citizenlex}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ─── Spring Boot Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: citizenlex-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-CitizenLexDB}
      DB_USER: ${DB_USER:-citizenlex}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-mock}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-mock}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-mock}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-mock}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-mock}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ─── React Frontend (Nginx) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: citizenlex-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local