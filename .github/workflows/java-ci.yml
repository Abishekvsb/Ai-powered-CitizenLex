name: Java CI/CD — Build, Test & Package

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: CitizenLexDB_Test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests for fast compile check)
        run: mvn clean compile -f backend/pom.xml
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: CitizenLexDB_Test
          DB_USER: root
          DB_PASSWORD: testpassword
          GEMINI_API_KEY: mock
          CLOUDINARY_CLOUD_NAME: mock
          CLOUDINARY_API_KEY: mock
          CLOUDINARY_API_SECRET: mock

      - name: Package JAR
        run: mvn package -DskipTests -f backend/pom.xml
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: CitizenLexDB_Test
          DB_USER: root
          DB_PASSWORD: testpassword
          GEMINI_API_KEY: mock
          CLOUDINARY_CLOUD_NAME: mock
          CLOUDINARY_API_KEY: mock
          CLOUDINARY_API_SECRET: mock

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizenlex-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://citizenlex-api.railway.app
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: citizenlex-frontend-dist
          path: frontend/dist/
          retention-days: 7
