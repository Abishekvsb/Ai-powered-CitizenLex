services:
  - type: web
    name: citizenlex-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: citizenlex-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # User will fill this in the Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false # User will fill this in the Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false # User will fill this in the Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false # User will fill this in the Render dashboard

databases:
  - name: citizenlex-db
    plan: free
    databaseName: citizenlex
    user: citizenlex_user
